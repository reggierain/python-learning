
name: Birthday Wisher

on:
  schedule:
    - cron: '17 9 * * *'
      timezone: 'America/Toronto'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-birthday-emails:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: SMTP-DATETIME

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install pandas python-dotenv

      - name: Create birthday data
        env:
          BIRTHDAYS_CSV: ${{ secrets.BIRTHDAYS_CSV }}
        run: printf '%s\n' "$BIRTHDAYS_CSV" > birthdays.csv

      - name: Run Birthday Wisher
        env:
          MY_EMAIL: ${{ secrets.MY_EMAIL }}
          MY_EMAIL_APP_PASS: ${{ secrets.MY_EMAIL_APP_PASS }}
        run: python birthday_wisher.py
